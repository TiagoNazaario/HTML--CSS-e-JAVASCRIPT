<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Grown</title>
    <style>
        div.container {
            background-color: salmon;

            display: flex; 
            flex-flow: row nowrap;
        }
        
        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            padding: 5px;
        }
        #cxA {
            flex-grow: 0;
            flex-shrink: 2;
        }
        #cxB {
            flex-grow: 4;
            flex-shrink: 1; 
        }
        #cxC {
            flex-grow: 1;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
