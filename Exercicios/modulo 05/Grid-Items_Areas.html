<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Pratica</title>
    <style>
        div.container {
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        div.items {
            padding: 5px;
            text-align: center;
            align-content: center;
            color: white;
            text-shadow: 0px 0px 5px white;
        }
        .items:hover {
            cursor: pointer;
        }

        #item1 {
            background-color: rgb(255, 89, 89);

            grid-row-start: 1;
            grid-column-start: 1;
            
            grid-row-end: 2;
            grid-column-end: 5;
        }
        #item1:hover {
            background-color: red;
        }

        #item2 {
            background-color: rgb(31, 182, 31);

            grid-row-start: 2;
            grid-column-start: 1;

            grid-row-end: 5;
            grid-column-end: 3;
        }
        #item2:hover {
            background-color: green;
        }

        #item3 {
            background-color: rgb(72, 72, 255);

            grid-row-start: 2;
            grid-column-start: 3;

            grid-row-end: 5;
            grid-column-end: 5;
        }
        #item3:hover {
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="item1">A</div>
        <div class="items" id="item2">B</div>
        <div class="items" id="item3">C</div>
    </div>
</body>
</html>
