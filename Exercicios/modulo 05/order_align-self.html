<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        div.container {
            background-color: salmon;

            display: flex; 
            flex-flow: row wrap;
            align-items: self-end;
            height: 300px;
        }
        
        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="align-self: auto; order: 4;">A</div>
        <div class="item" style="align-self: flex-start; order: 2;">B</div>
        <div class="item" style="align-self: flex-end;">C</div>
        <div class="item" style="align-self: center;">D</div>
        <div class="item" style="align-self: stretch;">E</div>
        <div class="item">F</div>
        <div class="item" style="align-self: stretch;">G</div>
    </div>
</body>
</html>
